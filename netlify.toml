[build]
  command = "npm run build"
  publish = "dist"

# En-têtes de sécurité, appliqués à tout le site.
#
# Pas de Content-Security-Policy ici : la page charge gtag depuis
# googletagmanager.com, les polices depuis Google Fonts, et exécute deux scripts
# inline (JSON-LD, initialisation gtag). Une CSP correcte demande de lister ces
# origines et de traiter l'inline — à faire, mais à tester avant, sous peine de
# casser l'analytique en silence.
[[headers]]
  for = "/*"
  [headers.values]
    # Empêche l'affichage du site dans une iframe tierce (clickjacking).
    x-frame-options = "SAMEORIGIN"
    # Interdit au navigateur de deviner un type MIME différent de celui servi.
    x-content-type-options = "nosniff"
    # Transmet l'origine, jamais l'URL complète, vers un autre domaine.
    referrer-policy = "strict-origin-when-cross-origin"
    # HTTPS obligatoire pendant deux ans. Netlify sert déjà tout en TLS.
    strict-transport-security = "max-age=63072000; includeSubDomains"
    # Le site n'utilise aucune de ces API : on les refuse explicitement.
    permissions-policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Les assets portent un hash de contenu dans leur nom : ils sont immuables.
# Sans cette règle, Netlify sert max-age=0 et chaque visiteur récurrent
# refait un aller-retour de revalidation pour rien.
[[headers]]
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

# Les médias d'article ne portent pas de hash : ils peuvent être remplacés par
# une nouvelle capture sous le même nom. Un mois de cache, pas « immutable ».
[[headers]]
  for = "/media/*"
  [headers.values]
    cache-control = "public, max-age=2592000"

# Toutes les routes sont prérendues en fichiers statiques (voir
# scripts/prerender.mjs), donc le fallback SPA n'a plus lieu d'être.
# Une URL inconnue doit renvoyer un vrai 404, pas la page d'accueil en 200.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
